<!doctype html>
<html lang="es-GT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unidades de Trabajo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@1,700&family=Open+Sans:wght@400;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   Sitio de clase - estilo Liceo Tec
   Cambia los colores aquí: todo el sitio usa estas variables.
   ========================================================== */
:root {
  --pizarra: #2e3340;      /* banner y círculos */
  --naranja: #e07a2c;      /* acento, encabezados, banda, pie */
  --naranja-osc: #c4651c;
  --texto: #212121;
  --fondo: #ffffff;
  --gris-suave: #f4f5f7;
  --borde: #e3e5e9;
  --blanco: #ffffff;
  /* colores de los minijuegos (llamativos) */
  --j-verde: #34c759;
  --j-rojo: #ff4d4f;
  --j-azul: #2f8cff;
  --j-amarillo: #ffcc00;
  --j-morado: #8e5cf7;
  --j-rosa: #ff5fa2;
  --j-turquesa: #14c4c4;
  --ancho: 1000px;
  --f-titulo: 'Roboto', Arial, sans-serif;
  --f-texto: 'Open Sans', Arial, sans-serif;
  --f-cursiva: 'Lato', Arial, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font-family: var(--f-texto);
  font-size: 17px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
img, svg { max-width: 100%; }
a { color: var(--naranja); }
h1, h2, h3, h4 { font-family: var(--f-titulo); line-height: 1.25; }
button { font-family: var(--f-titulo); }

/* ---------- Encabezado ---------- */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  background: transparent; color: #fff;
  transition: background .25s, box-shadow .25s, color .25s;
}
.header.scrolled { background: #fff; color: var(--naranja); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.header-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between; height: 64px;
}
.brand { font-family: var(--f-titulo); font-weight: 700; font-size: 18px; color: inherit; text-decoration: none; letter-spacing: .3px; }
.nav { display: flex; gap: 4px; align-items: center; }
.nav-item { position: relative; }
.nav-link {
  display: flex; align-items: center; gap: 4px;
  color: inherit; text-decoration: none; font-family: var(--f-titulo); font-size: 15px; font-weight: 500;
  padding: 10px 14px; background: none; border: 0; cursor: pointer; border-radius: 4px;
}
.nav-link:hover, .nav-link:focus-visible { background: rgba(255,255,255,.15); }
.header.scrolled .nav-link:hover { background: rgba(224,122,44,.1); }
.nav-link svg { width: 14px; height: 14px; }
.dropdown {
  display: none; position: absolute; top: 100%; left: 0; min-width: 230px;
  background: #fff; border-radius: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.18); padding: 6px 0; z-index: 60;
}
.nav-item:hover .dropdown, .nav-item.open .dropdown, .nav-item:focus-within .dropdown { display: block; }
.dropdown a { display: block; padding: 9px 18px; color: var(--texto); text-decoration: none; font-size: 15px; }
.dropdown a:hover { background: var(--gris-suave); color: var(--naranja); }
.hamburger { display: none; background: none; border: 0; color: inherit; cursor: pointer; padding: 8px; }
.hamburger svg { width: 28px; height: 28px; }

@media (max-width: 760px) {
  .hamburger { display: block; }
  .nav {
    display: none; position: absolute; top: 64px; left: 0; right: 0;
    flex-direction: column; align-items: stretch; gap: 0;
    background: #fff; box-shadow: 0 8px 16px rgba(0,0,0,.15); padding: 8px 0;
    max-height: calc(100vh - 64px); overflow-y: auto;
  }
  .nav.open { display: flex; }
  .nav-link { color: var(--texto); padding: 12px 20px; width: 100%; justify-content: space-between; }
  .nav-item:hover .dropdown { display: none; }
  .nav-item.open .dropdown { display: block; }
  .dropdown { position: static; box-shadow: none; padding: 0 0 6px 16px; }
}

/* ---------- Banner ---------- */
.banner {
  background-color: var(--pizarra);
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22260%22%20height%3D%22260%22%20viewBox%3D%220%200%20260%20260%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-opacity%3D%220.11%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%20%3Cg%20transform%3D%22translate(14%2C16)%22%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%2246%22%20height%3D%2232%22%20rx%3D%223%22%2F%3E%3Cpath%20d%3D%22M16%2042h14M23%2032v10%22%2F%3E%3C%2Fg%3E%20%3Cg%20transform%3D%22translate(118%2C24)%22%3E%3Ccircle%20cx%3D%2218%22%20cy%3D%2218%22%20r%3D%227%22%2F%3E%3Cpath%20d%3D%22M18%202v6M18%2028v6M2%2018h6M28%2018h6M6.7%206.7l4.2%204.2M25.1%2025.1l4.2%204.2M6.7%2029.3l4.2-4.2M25.1%2010.9l4.2-4.2%22%2F%3E%3C%2Fg%3E%20%3Cg%20transform%3D%22translate(200%2C14)%22%3E%3Crect%20x%3D%228%22%20y%3D%228%22%20width%3D%2228%22%20height%3D%2228%22%20rx%3D%223%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%2216%22%20width%3D%2212%22%20height%3D%2212%22%2F%3E%3Cpath%20d%3D%22M15%202v6M22%202v6M29%202v6M15%2036v6M22%2036v6M29%2036v6M2%2015h6M2%2022h6M2%2029h6M36%2015h6M36%2022h6M36%2029h6%22%2F%3E%3C%2Fg%3E%20%3Cg%20transform%3D%22translate(30%2C110)%22%3E%3Cpath%20d%3D%22M0%2012a30%2030%200%200%201%2042%200M7%2020a20%2020%200%200%201%2028%200M14%2028a10%2010%200%200%201%2014%200%22%2F%3E%3Ccircle%20cx%3D%2221%22%20cy%3D%2235%22%20r%3D%222%22%2F%3E%3C%2Fg%3E%20%3Cg%20transform%3D%22translate(124%2C104)%22%3E%3Cpath%20d%3D%22M18%200v40M18%200l-5%207h10zM18%2022l-10-8v-4M18%2030l10-8v-5%22%2F%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%222.5%22%2F%3E%3Crect%20x%3D%2225%22%20y%3D%2213%22%20width%3D%226%22%20height%3D%225%22%2F%3E%3Ccircle%20cx%3D%2218%22%20cy%3D%2244%22%20r%3D%224%22%2F%3E%3C%2Fg%3E%20%3Cg%20transform%3D%22translate(208%2C100)%22%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%2228%22%20height%3D%2244%22%20rx%3D%2214%22%2F%3E%3Cpath%20d%3D%22M14%200v14M0%2016h28%22%2F%3E%3C%2Fg%3E%20%3Cg%20transform%3D%22translate(20%2C190)%22%3E%3Cpath%20d%3D%22M4%2050l14-14M18%2036l6%206M24%2042l-4%204-12-12%204-4zM24%2030l20-20%206%206-20%2020%22%2F%3E%3C%2Fg%3E%20%3Cg%20transform%3D%22translate(110%2C196)%22%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%2240%22%20height%3D%2228%22%20rx%3D%223%22%2F%3E%3Cpath%20d%3D%22M14%2036h12M20%2028v8%22%2F%3E%3C%2Fg%3E%20%3Cg%20transform%3D%22translate(200%2C190)%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%226%22%2F%3E%3Cpath%20d%3D%22M16%202v5M16%2025v5M2%2016h5M25%2016h5M6%206l3.5%203.5M22.5%2022.5L26%2026M6%2026l3.5-3.5M22.5%209.5L26%206%22%2F%3E%3C%2Fg%3E%20%3C%2Fsvg%3E");
  background-size: 260px 260px;
  color: #fff; text-align: center;
  padding: 130px 16px 70px;
  min-height: 320px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.banner h1 { margin: 0; font-family: var(--f-titulo); font-weight: 700; font-size: clamp(32px, 6vw, 56px); }
.banner h1.cursiva { font-family: var(--f-cursiva); font-style: italic; font-weight: 700; }
.banner .sub { margin: 10px 0 0; font-family: var(--f-titulo); font-size: clamp(18px, 3vw, 24px); letter-spacing: 1px; }
.banner .frase { margin: 12px 0 0; font-family: var(--f-cursiva); font-style: italic; font-size: clamp(17px, 2.6vw, 21px); max-width: 720px; }
.barra { width: 112px; height: 5px; background: var(--naranja); margin: 22px auto 0; }

/* ---------- Banda naranja ---------- */
.banda {
  background: var(--naranja); color: #fff; text-align: center;
  padding: 26px 16px;
}
.banda h2 { margin: 0; font-family: var(--f-titulo); font-weight: 700; font-size: clamp(21px, 3.4vw, 30px); }
.banda .cursiva { font-family: var(--f-cursiva); font-style: italic; font-weight: 700; font-size: clamp(19px, 3vw, 26px); margin: 0; }
.banda-icono { display: flex; align-items: center; justify-content: center; gap: 14px; }
.banda-icono svg { width: 44px; height: 44px; flex: none; }
.banda .logo { max-height: 90px; max-width: 260px; display: block; margin: 0 auto; }
.logo-alt { display: inline-block; border: 2px dashed rgba(255,255,255,.8); padding: 14px 24px; font-family: var(--f-titulo); font-weight: 700; letter-spacing: 1px; }

/* ---------- Contenido ---------- */
.contenido { max-width: var(--ancho); margin: 0 auto; padding: 40px 16px 56px; }
.contenido h2 { color: var(--naranja); font-size: 28px; margin: 36px 0 12px; }
.contenido h2:first-child { margin-top: 0; }
.contenido h3 { color: var(--naranja); font-size: 21px; margin: 28px 0 8px; }
.contenido p { margin: 0 0 14px; }
.justificado { text-align: justify; }
ul.cuadradas { list-style: square; padding-left: 24px; }
ul.cuadradas li { margin-bottom: 6px; text-align: justify; }
ul.cuadradas li::marker { color: var(--naranja); }

.tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 18px 20px; margin: 16px 0; }
.tarjeta.ejemplo { border-left: 5px solid var(--naranja); }
.tarjeta h4 { margin: 0 0 8px; color: var(--pizarra); font-size: 17px; }
.tarjeta p:last-child { margin-bottom: 0; }
.diagrama { text-align: center; margin: 18px 0; }
.diagrama svg { width: 100%; max-width: 620px; height: auto; }
.diagrama .pie-fig { font-size: 14px; color: #555; margin-top: 4px; }

.tabla-wrap { overflow-x: auto; margin: 16px 0; }
table { border-collapse: collapse; width: 100%; min-width: 320px; }
th { background: var(--pizarra); color: #fff; font-family: var(--f-titulo); font-weight: 500; text-align: left; padding: 10px 12px; }
td { border-bottom: 1px solid var(--borde); padding: 9px 12px; vertical-align: top; }
tr:nth-child(even) td { background: var(--gris-suave); }

.video { position: relative; padding-top: 56.25%; margin: 16px 0; border-radius: 8px; overflow: hidden; background: #000; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-busqueda { border: 2px dashed var(--borde); border-radius: 8px; padding: 18px 20px; display: flex; gap: 16px; align-items: center; margin: 16px 0; }
.video-busqueda svg { width: 46px; height: 46px; flex: none; color: var(--naranja); }
.video-busqueda p { margin: 0 0 6px; }

/* ---------- Círculos (unidades, semanas, visión) ---------- */
.circulos { display: flex; flex-wrap: wrap; justify-content: center; gap: 48px 64px; padding: 12px 0; }
.circulo-link { display: flex; flex-direction: column; align-items: center; text-decoration: none; gap: 14px; }
.circulo {
  width: 170px; height: 170px; border-radius: 50%; background: var(--pizarra); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-titulo); font-weight: 700; font-size: 76px;
  transition: transform .2s, box-shadow .2s;
}
.circulo-link:hover .circulo, .circulo-link:focus-visible .circulo { transform: scale(1.05); box-shadow: 0 8px 20px rgba(0,0,0,.25); }
.etiqueta { color: var(--naranja); font-family: var(--f-titulo); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 18px; }
.circulo svg { width: 46%; height: 46%; }

/* Visión y misión */
.vm { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin: 24px 0; }
.vm-item { text-align: center; }
.vm-item .circulo { width: 140px; height: 140px; margin: 0 auto 14px; }
.vm-item h3 { margin-top: 0; }
.vm-item p { text-align: justify; }
@media (max-width: 700px) { .vm { grid-template-columns: 1fr; } }

.perfil { display: grid; grid-template-columns: 1fr 180px; gap: 28px; align-items: center; }
.perfil .icono-grande { color: var(--pizarra); }
.perfil .icono-grande svg { width: 100%; height: auto; }
@media (max-width: 700px) { .perfil { grid-template-columns: 1fr; } .perfil .icono-grande { max-width: 130px; margin: 0 auto; order: -1; } }

/* Desplegable (bienvenida y semanas) */
.desplegar-btn {
  width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: none; border: 0; padding: 4px 0; cursor: pointer; text-align: left;
  color: var(--naranja); font-family: var(--f-titulo); font-weight: 700; font-size: 24px;
}
.desplegar-btn svg { width: 28px; height: 28px; transition: transform .25s; flex: none; }
.desplegar-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.desplegable { display: none; padding-top: 10px; }
.desplegable.abierto { display: block; }

.semana-fila { display: grid; grid-template-columns: 96px 1fr; gap: 22px; align-items: start; padding: 18px 0; }
.semana-fila .circulo { width: 90px; height: 90px; font-size: 40px; }
.semana-fila .circulo-link { gap: 0; }
.semana-fila .linea { border-bottom: 2px solid var(--borde); padding-bottom: 14px; padding-top: 22px; }
.semana-fila .desplegable p { margin: 0 0 10px; }
.btn-ir {
  display: inline-block; background: var(--naranja); color: #fff; text-decoration: none;
  padding: 9px 22px; border-radius: 4px; font-family: var(--f-titulo); font-weight: 500;
}
.btn-ir:hover { background: var(--naranja-osc); }
@media (max-width: 480px) {
  .semana-fila { grid-template-columns: 64px 1fr; gap: 14px; }
  .semana-fila .circulo { width: 62px; height: 62px; font-size: 28px; }
  .semana-fila .linea { padding-top: 12px; }
  .desplegar-btn { font-size: 21px; }
  .circulo { width: 140px; height: 140px; font-size: 62px; }
}

/* Secciones de semana */
.seccion { margin-top: 44px; }
.seccion > h2 { border-bottom: 3px solid var(--naranja); padding-bottom: 6px; }

/* Fases de proyecto */
.fase-contenido { max-width: var(--ancho); margin: 0 auto; padding: 30px 16px 40px; }
.fase-contenido .obj { color: var(--naranja); font-family: var(--f-titulo); font-weight: 700; font-size: 20px; margin-bottom: 6px; }
.fase-contenido .instr { font-weight: 700; font-family: var(--f-titulo); font-size: 18px; margin: 18px 0 6px; }
.checklist { list-style: none; padding: 0; }
.checklist li { margin: 8px 0; }
.checklist label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.checklist input { width: 22px; height: 22px; accent-color: var(--naranja); flex: none; margin-top: 2px; }
.galeria-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; margin: 20px 0; }
.galeria-slot { aspect-ratio: 4/3; border: 2px dashed var(--borde); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #777; text-align: center; padding: 12px; font-size: 15px; }
.galeria-slot svg { width: 48px; height: 48px; color: #aab; margin-bottom: 8px; }

/* ---------- Pie ---------- */
.pie { background: var(--naranja); padding: 34px 16px; }
.pie-inner { max-width: var(--ancho); margin: 0 auto; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
.btn-blanco {
  display: inline-block; background: #fff; color: var(--naranja); text-decoration: none; text-align: center;
  font-family: var(--f-titulo); font-weight: 700; font-size: 17px;
  padding: 14px 20px; border-radius: 4px; min-width: 280px; transition: transform .15s, box-shadow .15s;
}
.btn-blanco:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.18); }
@media (max-width: 400px) { .btn-blanco { min-width: 0; width: 100%; } }

/* ---------- Modo incrustado (Google Sites) ---------- */
body.embed { background: #fff; }
body.embed .contenido { padding-top: 20px; }

/* ==========================================================
   MINIJUEGOS
   ========================================================== */
.juego {
  border-radius: 18px; overflow: hidden; margin: 22px 0 34px;
  box-shadow: 0 6px 20px rgba(0,0,0,.12); background: #fff; border: 3px solid var(--j-azul);
  font-family: var(--f-titulo);
}
.juego-head {
  background: linear-gradient(90deg, var(--j-morado), var(--j-azul)); color: #fff;
  padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
}
.juego-head h3 { margin: 0; color: #fff; font-size: 22px; }
.juego-marcador { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 16px; }
.pill { background: rgba(255,255,255,.22); border-radius: 999px; padding: 4px 12px; display: inline-flex; align-items: center; gap: 6px; }
.pill svg { width: 18px; height: 18px; }
.juego-body { padding: 18px; position: relative; }
.instrucciones {
  background: #fff8e1; border: 3px dashed var(--j-amarillo); border-radius: 14px; padding: 14px 18px; margin-bottom: 16px;
  font-family: var(--f-texto); font-size: 17px;
}
.instrucciones strong { font-family: var(--f-titulo); color: #b26a00; display: block; font-size: 18px; margin-bottom: 4px; }
.instrucciones ol { margin: 6px 0 0; padding-left: 22px; }
.btn-jugar, .btn-j {
  border: 0; cursor: pointer; border-radius: 999px; font-weight: 700; color: #fff;
  padding: 13px 30px; font-size: 20px; background: var(--j-verde);
  box-shadow: 0 5px 0 #23913f; transition: transform .1s, box-shadow .1s;
}
.btn-jugar:active, .btn-j:active { transform: translateY(4px); box-shadow: 0 1px 0 #23913f; }
.btn-j.azul { background: var(--j-azul); box-shadow: 0 5px 0 #1c64c0; }
.btn-j.naranja { background: var(--naranja); box-shadow: 0 5px 0 var(--naranja-osc); }
.btn-j.chico { font-size: 16px; padding: 9px 20px; }
.centro { text-align: center; }
.pregunta {
  text-align: center; font-size: clamp(24px, 5vw, 36px); font-weight: 900; color: var(--pizarra);
  background: #fff; border-radius: 14px; padding: 10px 14px; margin: 0 auto 10px; max-width: 640px;
  box-shadow: 0 3px 0 rgba(0,0,0,.08);
}
.pregunta .fig { display: block; margin: 6px auto 0; max-width: 420px; }
.pregunta .fig svg { width: 100%; height: auto; max-height: 190px; }
.escena { position: relative; border-radius: 14px; overflow: hidden; min-height: 360px; user-select: none; -webkit-user-select: none; }
.feedback { text-align: center; font-size: 22px; font-weight: 900; min-height: 34px; margin-top: 10px; }
.feedback.bien { color: #1f9d48; }
.feedback.mal { color: #e5383b; }
.progreso { height: 12px; border-radius: 999px; background: #e9ecf3; overflow: hidden; margin: 10px 0 14px; }
.progreso > div { height: 100%; background: linear-gradient(90deg, var(--j-verde), var(--j-amarillo)); width: 0; transition: width .4s; }

/* Rana */
.escena-rana { background: linear-gradient(#bfefff 0 30%, #3fb3e8 30% 100%); }
.escena-rana .orilla { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: #6cc644; border-top: 6px solid #4a9e2c; }
.nenufares { position: absolute; left: 0; right: 0; top: 42%; display: flex; justify-content: space-around; padding: 0 10px; }
.nenufar {
  width: 112px; height: 84px; border: 0; cursor: pointer; background: none; position: relative; padding: 0;
  animation: flotar 2.8s ease-in-out infinite;
}
.nenufar:nth-child(2) { animation-delay: .5s; } .nenufar:nth-child(3) { animation-delay: 1s; }
.nenufar svg { width: 100%; height: 100%; position: absolute; inset: 0; }

    var caja = el('div', { class: 'juego' });

    marc.appendChild(pAciertos); marc.appendChild(bSon);
    head.appendChild(marc);
    var body = el('div', { class: 'juego-body' });
    caja.appendChild(head); caja.appendChild(body);
    cont.appendChild(caja);

    var estado = { aciertos: 0, errores: 0 };
    var api = {
      body: body,
      acierto: function () { estado.aciertos++; pAciertos.querySelector('b').textContent = estado.aciertos; SON.bien(); },
      error: function () { estado.errores++; SON.mal(); },
      terminar: function (total) {
        var ratio = estado.aciertos / Math.max(1, estado.aciertos + estado.errores);
        if (total != null) ratio = Math.min(ratio, estado.aciertos / Math.max(1, total));
        var est = ratio >= 0.85 ? 3 : ratio >= 0.6 ? 2 : 1;
        if (est > record) { record = est; store.set('juego:' + idJuego, est); }
        SON.fin();
        body.innerHTML = '';
        var f = el('div', { class: 'final' });
        var msg = est === 3 ? '¡Eres una estrella de las matemáticas!' : est === 2 ? '¡Muy buen trabajo! Puedes intentarlo otra vez para ganar más estrellas.' : '¡Buen intento! Juega otra vez y verás cómo mejoras.';
        f.innerHTML = '<div class="estrellas">' + I.estrellaRelleno(est >= 1) + I.estrellaRelleno(est >= 2) + I.estrellaRelleno(est >= 3) + '</div>' +
          '<h4>¡Terminaste!</h4><p>' + msg + '</p><p>Aciertos: <b>' + estado.aciertos + '</b> &nbsp; Intentos fallidos: <b>' + estado.errores + '</b></p>';

        b.addEventListener('click', function () { iniciar(); });
        f.appendChild(b);
        body.appendChild(f);
        confeti(body, 40);
      }
    };

    function iniciar() {
      estado.aciertos = 0; estado.errores = 0;
      pAciertos.querySelector('b').textContent = '0';
      body.innerHTML = '';
      JUEGOS[cfg.tipo](api, cfg);
    }

    /* pantalla de instrucciones */
    var ins = el('div', { class: 'instrucciones' });
    var pasos = (cfg.instrucciones || []).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('');
    ins.innerHTML = '<strong>¿Cómo se juega?</strong><ol>' + pasos + '</ol>';
    body.appendChild(ins);
    var zona = el('div', { class: 'centro' });
    if (record) zona.innerHTML = '<p style="margin:0 0 10px;font-family:var(--f-texto)">Tu mejor resultado: ' + record + ' de 3 estrellas</p>';
    var bj = el('button', { class: 'btn-jugar', type: 'button' }, '¡A jugar!');
    bj.addEventListener('click', iniciar);
    zona.appendChild(bj);
    body.appendChild(zona);
  }

    function ronda() {
      if (r >= rondas.length) return api.terminar();
      var R = rondas[r]; bandejaV = []; fb.textContent = ''; fb.className = 'feedback';
      prod.innerHTML = '<div class="prod-img">' + fig({ fig: 'producto', p: R.prod }) + '</div><div><div style="font-size:22px;font-weight:900;color:#2e3340;margin-bottom:8px">' + esc(R.nombre) + '</div><div class="etiqueta-precio">Q' + R.precio + '</div></div>';
      dibujar();
    }
    bPagar.addEventListener('click', function () {
      if (r >= rondas.length) return;
      var p = rondas[r].precio, s = suma();
      if (s === p) { api.acierto(); decir(fb, true, '¡Pago exacto! Pagaste Q' + p + '.'); confeti(api.body, 26); r++; setTimeout(ronda, 1500); }
      else { api.error(); decir(fb, false, s < p ? 'Te faltan Q' + (p - s) + '.' : 'Te pasaste por Q' + (s - p) + '. Quita algo de la bandeja.'); }
    });
    ronda();
  };

  /* ---------- Gráfica: construye el pictograma ---------- */
  JUEGOS.grafica = function (api, cfg) {
    var cats = cfg.categorias, vals = cats.map(function () { return 0; });
    var preg = el('div', { class: 'pregunta', style: 'font-size:22px' }, esc(cfg.q || 'Construye la gráfica con los datos de la tabla'));
    api.body.appendChild(preg);
    var tabla = el('div', { class: 'tabla-wrap tabla-conteo' });
    tabla.innerHTML = '<table><thead><tr><th>' + esc(cfg.columna || 'Opción') + '</th><th>Votos</th></tr></thead><tbody>' +
      cats.map(function (c) { return '<tr><td>' + esc(c.nombre) + '</td><td><b>' + c.valor + '</b></td></tr>'; }).join('') + '</tbody></table>';
    api.body.appendChild(tabla);
    var graf = el('div', { class: 'grafica' }); api.body.appendChild(graf);
    var pilas = cats.map(function (c, k) {
      var col = el('div', { class: 'columna-g' });
      var pila = el('div', { class: 'pila' });
      var bt = el('div', { class: 'botones' });
      var m = el('button', { type: 'button', style: 'background:#ff4d4f', 'aria-label': 'Quitar en ' + c.nombre }, '-');
      var p = el('button', { type: 'button', style: 'background:#34c759', 'aria-label': 'Agregar en ' + c.nombre }, '+');
      m.addEventListener('click', function () { if (vals[k] > 0) { vals[k]--; dib(k); tono([420], .05); } });
      p.addEventListener('click', function () { if (vals[k] < 6) { vals[k]++; dib(k); tono([620], .05); } });
      bt.appendChild(m); bt.appendChild(p);
      col.appendChild(pila); col.appendChild(el('div', { class: 'nombre' }, esc(c.nombre))); col.appendChild(bt);
      graf.appendChild(col); return pila;
    });
    function dib(k) {
      var h = ''; for (var j = 0; j < vals[k]; j++) h += '<svg viewBox="0 0 40 40">' + FIG._obj(cats[k].icono || 'manzana') + '</svg>';
      pilas[k].innerHTML = h;
    }
    var acc = el('div', { class: 'centro', style: 'margin-top:12px' });
    var b = el('button', { class: 'btn-j', type: 'button' }, 'Comprobar'); acc.appendChild(b); api.body.appendChild(acc);
    var fb = feedbackEl(); api.body.appendChild(fb);
    var preguntasDespues = cfg.preguntas || [];
    b.addEventListener('click', function () {
      var malas = cats.filter(function (c, k) { return vals[k] !== c.valor; });
      if (!malas.length) {
        api.acierto(); decir(fb, true, '¡Tu gráfica está perfecta!'); confeti(api.body, 30);
        b.style.display = 'none';
        if (preguntasDespues.length) setTimeout(function () { preguntasGrafica(); }, 1200);
        else setTimeout(function () { api.terminar(); }, 1400);
      } else { api.error(); decir(fb, false, 'Revisa: ' + malas.map(function (c) { return c.nombre; }).join(', ') + '. Cuenta otra vez los votos de la tabla.'); }
    });
    function preguntasGrafica() {
      var i = 0, zona = el('div', { style: 'margin-top:18px' }); api.body.appendChild(zona);
      function una() {
        if (i >= preguntasDespues.length) return api.terminar();
        var q = preguntasDespues[i]; zona.innerHTML = '';
        zona.appendChild(el('div', { class: 'pregunta', style: 'font-size:22px' }, esc(q.q)));
        var ops = el('div', { class: 'opciones' }), listo = false;
        barajar(q.ops).forEach(function (op, j) {
          var bt = el('button', { class: 'btn-op', type: 'button', style: 'background:' + COLORES[(j + 1) % COLORES.length] + ';font-size:21px' }, esc(op));
          bt.addEventListener('click', function () {
            if (listo || bt.disabled) return;
            if (op === q.r) { listo = true; api.acierto(); decir(fb, true); i++; setTimeout(una, 1000); }
            else { bt.disabled = true; bt.style.opacity = .35; api.error(); decir(fb, false); }
          });
          ops.appendChild(bt);
        });
        zona.appendChild(ops);
        zona.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      una();
    }
  };

  /* ==========================================================
     BLOQUES DE CONTENIDO
     ========================================================== */
  function bloque(b) {
    switch (b.t) {
      case 'h3': return '<h3>' + esc(b.x) + '</h3>';
      case 'p': return '<p class="justificado">' + b.x + '</p>';
      case 'lista': return '<ul class="cuadradas">' + b.items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
      case 'ejemplo': return '<div class="tarjeta ejemplo">' + (b.titulo ? '<h4>' + esc(b.titulo) + '</h4>' : '') + (b.x ? '<p>' + b.x + '</p>' : '') + (b.fig ? '<div class="diagrama">' + fig(b.fig) + '</div>' : '') + '</div>';
      case 'tarjeta': return '<div class="tarjeta">' + (b.titulo ? '<h4>' + esc(b.titulo) + '</h4>' : '') + b.x + '</div>';
      case 'fig': return '<div class="diagrama">' + fig(b.fig) + (b.pie ? '<div class="pie-fig">' + esc(b.pie) + '</div>' : '') + '</div>';
      case 'figs': return '<div class="diagrama" style="display:flex;flex-wrap:wrap;gap:18px;justify-content:center">' + b.figs.map(function (f) {
        return '<div style="width:' + (b.ancho || 130) + 'px;text-align:center">' + fig(f) + (f.nombre ? '<div class="pie-fig"><b>' + esc(f.nombre) + '</b>' + (f.nota ? '<br>' + esc(f.nota) : '') + '</div>' : '') + '</div>';
      }).join('') + '</div>';
      case 'tabla': return '<div class="tabla-wrap"><table><thead><tr>' + b.cab.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        b.filas.map(function (f) { return '<tr>' + f.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
      case 'video': return videoHtml(b);
      default: return '';
    }
  }
  function videoHtml(b) {
    /* window.VIDEOS_OK lo genera build.mjs solo con los videos que YouTube confirmó como incrustables */
    if (b.id && (window.VIDEOS_OK || {})[b.id]) {
      return '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/' + esc(b.id) + '" title="' + esc(b.titulo || 'Video') + '" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
    }
    var url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(b.busqueda || '');
    return '<div class="video-busqueda">' + I.lupa + '<div><p><b>Video sugerido:</b> ' + esc(b.titulo || b.busqueda) + '</p><p style="font-size:15px;color:#555">Aún no hay un video verificado para esta semana. Busca uno, revísalo antes de la clase y agrégalo en el archivo de datos.</p><a href="' + url + '" target="_blank" rel="noopener">Buscar en YouTube</a></div></div>';
  }

  /* ==========================================================
     ESTRUCTURA DE PÁGINA
     ========================================================== */
  function header() {
    var h = el('header', { class: 'header' });
    var proyectosLinks = PROYECTOS.map(function (p) {
      return '<a href="' + href('proyecto', p.u) + '">Proyecto U' + p.u + '</a><a href="' + href('galeria', p.u) + '">Galería de Evidencias U' + p.u + '</a>';
    }).join('');
    var unidadesLinks = UNIDADES.map(function (u) { return '<a href="' + href('unidad', u.n) + '">Unidad ' + u.n + '</a>'; }).join('');
    h.innerHTML = '<div class="header-inner"><a class="brand" href="' + href('inicio') + '">' + esc(SITIO.nombreCorto || 'Mi clase') + '</a>' +
      '<button class="hamburger" type="button" aria-label="Abrir menú" aria-expanded="false">' + I.menu + '</button>' +
      '<nav class="nav" aria-label="Menú principal">' +
      '<div class="nav-item"><a class="nav-link" href="' + href('inicio') + '">Inicio</a></div>' +
      '<div class="nav-item"><button class="nav-link" type="button" aria-expanded="false">Contenidos ' + I.abajo + '</button><div class="dropdown"><a href="' + href('unidades') + '">Unidades de Trabajo</a>' + unidadesLinks + '</div></div>' +
      '<div class="nav-item"><button class="nav-link" type="button" aria-expanded="false">Proyectos ' + I.abajo + '</button><div class="dropdown"><a href="' + href('proyectos') + '">Unidades</a>' + proyectosLinks + '</div></div>' +
      '</nav></div>';
    var nav = h.querySelector('.nav'), ham = h.querySelector('.hamburger');
    ham.addEventListener('click', function () {
      var o = nav.classList.toggle('open'); ham.setAttribute('aria-expanded', o);
      if (o) h.classList.add('scrolled'); else onScroll();
    });
    h.querySelectorAll('button.nav-link').forEach(function (b) {
      b.addEventListener('click', function () {
        var it = b.parentNode, o = !it.classList.contains('open');
        h.querySelectorAll('.nav-item.open').forEach(function (x) { x.classList.remove('open'); });
        if (o) it.classList.add('open');
        b.setAttribute('aria-expanded', o);
      });
    });
    document.addEventListener('click', function (e) {
      if (!h.contains(e.target)) h.querySelectorAll('.nav-item.open').forEach(function (x) { x.classList.remove('open'); });
    });
    function onScroll() { if (!nav.classList.contains('open')) h.classList.toggle('scrolled', window.scrollY > 40); }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return h;
  }
  function banner(titulo, opts) {
    opts = opts || {};

      (opts.sub ? '<p class="sub">' + esc(opts.sub) + '</p>' : '') +
      (opts.frase ? '<p class="frase">' + esc(opts.frase) + '</p>' : '') +
      '<div class="barra"></div></section>';
  }
  function banda(html, cursiva) { return '<section class="banda">' + (cursiva ? '<p class="cursiva">' + html + '</p>' : '<h2>' + html + '</h2>') + '</section>'; }
  function pie() {
    return '<footer class="pie"><div class="pie-inner"><a class="btn-blanco" href="' + href('inicio') + '"' + TARGET + '>Página Principal</a><a class="btn-blanco" href="' + href('unidades') + '"' + TARGET + '>Unidades de Trabajo</a></div></footer>';

  function desplegable(titulo, contenido, abierto) {

  /* ---------------- páginas ---------------- */
  var PAG = {};

  function unidad(n) { return UNIDADES.filter(function (u) { return u.n === n; })[0]; }

  /* ---------------- render ---------------- */
  function render() {
    var root = document.getElementById('app');
    var p = PAG[PAGINA.tipo]();
    root.innerHTML = '';
    if (EMBED) {
      document.body.classList.add('embed');
      var c = el('main', { class: 'contenido' });

      if (p.completo) { root.innerHTML = p.completo; }
      else root.appendChild(c);
    } else {
      document.body.insertBefore(header(), root);
      root.innerHTML = p.banner + (p.completo ? p.completo : (p.banda || '') + '<main class="contenido">' + p.contenido + '</main>') + pie();
    }
    activarDesplegables(root);
    if (p.despues) p.despues(root);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render); else render();

  /* expuesto para pruebas */
  window.__clase = { FIG: FIG, JUEGOS: JUEGOS, store: store };
})();
